<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детальный просмотр - TeamViewer 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #viewer-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        .controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
            background: rgba(10, 10, 30, 0.9);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(14, 113, 235, 0.3);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls-panel button {
            background: rgba(14, 113, 235, 0.8);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .controls-panel button:hover {
            background: #0E71EB;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(14, 113, 235, 0.4);
        }
        .zoom-group { display: flex; gap: 5px; }
        .zoom-group button { padding: 10px 15px; font-size: 1.2rem; }
        #back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 10, 30, 0.9);
            color: #0E71EB;
            border: 1px solid #0E71EB;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        #back-btn:hover { background: rgba(14, 113, 235, 0.2); }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <button id="back-btn">← Назад к галерее</button>
    <div id="viewer-container"></div>
    <div class="controls-panel">
        <div class="zoom-group">
            <button id="zoom-in" title="Приблизить">+</button>
            <button id="zoom-out" title="Отдалить">−</button>
        </div>
        <button id="view-front">Вид спереди</button>
        <button id="view-back">Вид сзади</button>
        <button id="view-left">Вид слева</button>
        <button id="view-right">Вид справа</button>
    </div>
    <script type="module" src="detail.js"></script>
</body>
</html>
