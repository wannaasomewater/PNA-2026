<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamViewer 3D - Галерея решений</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root {
            --tv-blue: #0E71EB;
            --tv-dark: #1B2333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%);
            color: #fff;
            min-height: 100vh;
        }

        header {
            background: rgba(10, 10, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(14, 113, 235, 0.3);
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--tv-blue);
            text-decoration: none;
        }

        .back-to-main {
            background: transparent;
            border: 1px solid var(--tv-blue);
            color: var(--tv-blue);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .back-to-main:hover {
            background: rgba(14, 113, 235, 0.1);
        }

        .upload-section {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .upload-btn {
            background: var(--tv-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            background: #0A5ECC;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(14, 113, 235, 0.4);
        }

        .upload-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #file-input {
            display: none;
        }

        .file-name {
            color: #aaa;
            font-size: 0.9rem;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .gallery {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: rgba(20, 20, 50, 0.8);
            border: 1px solid rgba(14, 113, 235, 0.2);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--tv-blue);
            box-shadow: 0 10px 30px rgba(14, 113, 235, 0.3);
        }

        .card canvas {
            width: 100%;
            height: 200px;
            display: block;
        }

        .card-info {
            padding: 15px;
        }

        .card-info h3 {
            margin: 0;
            color: #fff;
            font-size: 1.1rem;
        }

        .card-info p {
            margin: 5px 0 0;
            color: #aaa;
            font-size: 0.9rem;
        }

        @media (max-width: 1200px) {
            .gallery { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 800px) {
            .gallery { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 500px) {
            .gallery { grid-template-columns: 1fr; }
        }

        .fallback-icon {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: rgba(14, 113, 235, 0.1);
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-section">
                <a href="../index.html" class="back-to-main">← На главную</a>
                <span class="logo">🖥️ TeamViewer 3D Галерея</span>
            </div>
            <div class="upload-section">
                <span class="file-name" id="file-name">Файл не выбран</span>
                <button class="upload-btn" onclick="document.getElementById('file-input').click()">
                    Выбрать файл
                </button>
                <input type="file" id="file-input" accept=".glb,.gltf">
                <button class="upload-btn" id="upload-submit" disabled>Загрузить модель</button>
            </div>
        </div>
    </header>
    <div id="gallery" class="gallery"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
