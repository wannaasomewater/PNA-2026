<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор — ЛР 1 &amp; 2 | Павлинич Андрей</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript" src="script.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-meta-left"><strong>Павлинич Андрей</strong> · Группа ИУ5-43Б</div>
</nav>

<div class="page">

  <div class="tab-panel">

    <div class="main-layout">

      <div class="card calc-card">
        <div class="calc-wrapper">
          <div class="calc-shell">

            <div id="result" class="result">0</div>

            <div class="calc-row">
              <button id="btn_op_clear"   class="my-btn secondary">C</button>
              <button id="btn_op_sign"    class="my-btn secondary">+/−</button>
              <button id="btn_op_percent" class="my-btn secondary">%</button>
              <button id="btn_op_div"     class="my-btn primary">÷</button>
            </div>

            <div class="calc-row">
              <button id="btn_digit_7" class="my-btn">7</button>
              <button id="btn_digit_8" class="my-btn">8</button>
              <button id="btn_digit_9" class="my-btn">9</button>
              <button id="btn_op_mult" class="my-btn primary">×</button>
            </div>

            <div class="calc-row">
              <button id="btn_digit_4" class="my-btn">4</button>
              <button id="btn_digit_5" class="my-btn">5</button>
              <button id="btn_digit_6" class="my-btn">6</button>
              <button id="btn_op_minus" class="my-btn primary">−</button>
            </div>

            <div class="calc-row">
              <button id="btn_digit_1" class="my-btn">1</button>
              <button id="btn_digit_2" class="my-btn">2</button>
              <button id="btn_digit_3" class="my-btn">3</button>
              <button id="btn_op_plus" class="my-btn primary">+</button>
            </div>

            <div class="calc-row">
              <button id="btn_sq"        class="my-btn secondary">x²</button>
              <button id="btn_digit_0"   class="my-btn">0</button>
              <button id="btn_digit_dot" class="my-btn">.</button>
              <button id="btn_op_equal"  class="my-btn primary">= </button>
            </div>

          </div>

          <a class="gh-btn" href="https://github.com/wannaasomewater" target="_blank">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.031 1.531 1.031.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836a9.59 9.59 0 012.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
            GitHub
          </a>

        </div>
      </div>

      <div class="right-col">

        <div class="card">
          <div class="card-title"><div class="icon teal"></div>Смена темы</div>
          <p class="label-hint">Выберите тему оформления</p>
          <div class="theme-controls">
            <div class="theme-dot selected"
                 style="background:#111420; border:2px solid #3D7FE8;"
                 title="Тёмная" data-theme="dark">
              <span class="theme-label">Тёмная</span>
            </div>
            <div class="theme-dot"
                 style="background:#0B1F4A; border:2px solid #1CD2C2;"
                 title="Синяя" data-theme="blue">
              <span class="theme-label">Синяя</span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title"><div class="icon"></div>Применить операцию к числу</div>
          <p class="label-hint">Введите число на калькуляторе, затем выберите операцию</p>
          <select id="op-select" class="styled-select">
            <option value="">— выберите операцию —</option>
            <option value="sq">x² — возведение в квадрат</option>
            <option value="sqrt">√x — квадратный корень</option>
            <option value="inv">1/x — обратное число</option>
            <option value="fact">x! — факториал</option>
          </select>
          <div id="op-result" class="op-result-box" style="display:none;"></div>
        </div>

        <div class="card">
          </div>
          <div class="info-block teal" style="margin-top:12px;">
            референс - сайт <strong>TeamViewer</strong>
          </div>
        </div>

      </div><!-- /.right-col -->
    </div><!-- /.main-layout -->
  </div>

</div>

<div class="footer-bar">
  <span> <strong>Это футер</strong></span>
</div>

</body>
</html>
